name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOMAXPROCS: '3'
      GOFLAGS: '-p=3'
    services:
      postgres:
        image: postgres:18.1-alpine3.23
        env:
          POSTGRES_PASSWORD: fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: --concurrency=3 --timeout=10m
          working-directory: backend
      - name: Compile backend
        run: go build ./...
      - name: Unit tests
        env:
          CHANNEL_DETECTION_TEST_DSN: 'host=127.0.0.1 port=5432 user=postgres password=fixture dbname=postgres sslmode=disable'
        run: make test-unit

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: '10.34.6'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint:check
      - run: pnpm run typecheck
      - run: pnpm run test:run --maxWorkers=2 --minWorkers=1
